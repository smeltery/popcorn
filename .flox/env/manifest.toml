schema-version = "1.13.0"

[install]
actionlint.pkg-path = "actionlint"
elixir.pkg-path = "elixir"
fd.pkg-path = "fd"
gh.pkg-path = "gh"
git.pkg-path = "git"
gnumake.pkg-path = "gnumake"
imagemagick_light.pkg-path = "imagemagick_light"
nodejs_24.pkg-path = "nodejs_24"
nodejs_24.version = "24.13.0"
pre-commit.pkg-path = "pre-commit"
python312.pkg-path = "python312"
rustup.pkg-path = "rustup"
shellcheck.pkg-path = "shellcheck"
zstd.pkg-path = "zstd"

[vars]
POPCORN_PYTHON = "python3.12"
POPCORN_RUST_TOOLCHAIN = "1.87.0"

[hook]
on-activate = """
  cd "$FLOX_ENV_PROJECT" || exit 1

  if command -v rustup >/dev/null 2>&1; then
    rustup toolchain install "${POPCORN_RUST_TOOLCHAIN:-1.87.0}" \
      --profile minimal \
      --component rustfmt \
      --component clippy >/dev/null
    rustup target add wasm32-unknown-unknown >/dev/null
  fi

  if [ ! -x apps/docs/.venv/bin/python ]; then
    "${POPCORN_PYTHON:-python3.12}" -m venv apps/docs/.venv
  fi
  apps/docs/.venv/bin/python -m pip install --upgrade pip >/dev/null
  apps/docs/.venv/bin/python -m pip install -r apps/docs/requirements.txt >/dev/null

  export VIRTUAL_ENV="$FLOX_ENV_PROJECT/apps/docs/.venv"
  export PATH="$VIRTUAL_ENV/bin:$PATH"
"""

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
