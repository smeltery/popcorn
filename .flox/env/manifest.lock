      "POPCORN_RUST_TOOLCHAIN": "1.85.0"
    },
    "hook": {
      "on-activate": "  cd \"$FLOX_ENV_PROJECT\" || exit 1\n\n  if command -v rustup >/dev/null 2>&1; then\n    rustup toolchain install \"${POPCORN_RUST_TOOLCHAIN:-1.85.0}\" --profile minimal --component rustfmt --component clippy >/dev/null\n    rustup target add wasm32-unknown-unknown >/dev/null\n  fi\n\n  if [ ! -x apps/docs/.venv/bin/python ]; then\n    \"${POPCORN_PYTHON:-python3.12}\" -m venv apps/docs/.venv\n  fi\n  apps/docs/.venv/bin/python -m pip install --upgrade pip >/dev/null\n  apps/docs/.venv/bin/python -m pip install -r apps/docs/requirements.txt >/dev/null\n\n  export VIRTUAL_ENV=\"$FLOX_ENV_PROJECT/apps/docs/.venv\"\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    }
