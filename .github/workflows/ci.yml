name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Repo Hygiene
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Run hygiene gates
        uses: flox/activate-action@v1
        with:
          command: make check PYTHON=python3

  rust:
    name: Rust
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Integration test
        run: crates/cli/tests/integration.sh

  player:
    name: Player
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: packages/player
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/player
        run: bunx playwright install --with-deps chromium firefox

      - name: Build
        working-directory: packages/player
        run: bun run build

      - name: Test
        working-directory: packages/player
        run: bun run test

  server:
    name: Server
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/assets/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find imagemagick librsvg2-bin zstd
          if ! command -v fd >/dev/null 2>&1; then
            sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
          fi

      - name: Install Mix dependencies
        working-directory: apps/server
        run: mix deps.get --locked

      - name: Install asset dependencies
        working-directory: apps/server/assets
        run: npm ci

      - name: Compile
        working-directory: apps/server
        run: mix compile

      - name: Test
        working-directory: apps/server
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/popcorn_test
        run: mix test

  docs:
    name: Docs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/docs/requirements.txt

      - name: Install dependencies
        working-directory: apps/docs
        run: pip install -r requirements.txt

      - name: Build
        working-directory: apps/docs
        run: mkdocs build --strict

  release_smoke:
    name: Release Smoke
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release workflow
        run: make release-smoke
