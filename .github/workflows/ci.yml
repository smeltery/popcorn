name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Lint, Test, Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v3

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Integration test
        run: crates/cli/tests/integration.sh

  platform_smoke:
    name: Platform Smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            use-cross: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            use-cross: false
    env:
      CARGO: cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Use cross
        if: matrix.use-cross
        run: echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Install build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build target
        run: ${{ env.CARGO }} build -p popcorn --locked --target ${{ matrix.target }}

  player:
    name: Player
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/player/package-lock.json

      - name: Install dependencies
        working-directory: packages/player
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/player
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        working-directory: packages/player
        run: npm run build

      - name: Test
        working-directory: packages/player
        run: npm test

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.19.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/assets/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zstd

      - name: Install Mix dependencies
        working-directory: apps/server
        run: mix deps.get --locked

      - name: Install asset dependencies
        working-directory: apps/server/assets
        run: npm ci

      - name: Compile
        working-directory: apps/server
        run: mix compile

      - name: Test
        working-directory: apps/server
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/popcorn_test
        run: mix test

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/docs/requirements.txt

      - name: Install dependencies
        working-directory: apps/docs
        run: pip install -r requirements.txt

      - name: Build
        working-directory: apps/docs
        run: mkdocs build --strict

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release workflow
        run: |
          test -f .github/workflows/release.yml
          grep -q "aarch64-apple-darwin" .github/workflows/release.yml
          grep -q "x86_64-unknown-linux-gnu" .github/workflows/release.yml
