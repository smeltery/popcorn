version: '3'

volumes:
  m2:
  node_modules:
  build:
  deps:
  cache:

services:
  postgres:
    image: postgres:14-alpine
    container_name: popcorn_dev_postgres
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 2345:5432

  nginx:
    image: nginx:alpine
    container_name: popcorn_dev_nginx
    links:
      - phoenix
    ports:
      - "3000:80"
    volumes:
      - ../docker/nginx/popcorn.conf:/etc/nginx/conf.d/default.conf:ro
      - cache:/cache

  phoenix:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    image: smeltery/popcorn:local
    container_name: popcorn_dev_phoenix
    entrypoint: env -u MIX_ENV -u PORT
    command: mix phx.server
    links:
      - postgres
    env_file: .env.development
    ports:
      - 4000:4000
    volumes:
      - ../uploads:/app/uploads:cached
      - node_modules:/app/assets/node_modules:cached
      - build:/app/_build:cached
      - deps:/app/deps:cached
      - m2:/root/.m2:cached
      - ../:/app:cached
      - /tmp/popcorn-web:/tmp:cached
