[package]
name = "popcorn-gif"
version = "0.1.0"
authors = ["dotbrains"]
edition = "2021"
homepage = "https://popcorn.dotbrains.local/docs/manual/popcorn-gif/"
repository = "https://github.com/dotbrains/popcorn"
description = "popcorn gif generator"
license-file = "LICENSE"

include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/fonts/NotoEmoji-OFL.txt",
    "/fonts/NotoEmoji-Regular.ttf",
    "/fonts/SymbolsNerdFont-LICENSE.txt",
    "/fonts/SymbolsNerdFont-Regular.ttf",
    "/src/**",
]

# MSRV
rust-version = "1.85.0"

[dependencies]
anyhow = "1.0.102"
popcorn_terminal = { package = "popcorn-terminal", path = "../avt" }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
fontdb = "0.23.0"
gifski = "1.34.0"
imgref = "1.12.1"
log = "0.4.29"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "gzip"] }
resvg = { version = "0.45.1", features = ["text"] }
rgb = "0.8.53"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shellexpand = "3.1.2"
swash = "0.2.7"
tiny-skia = "0.11.4"
ttf-parser = "0.25.1"
usvg = "0.45.1"
