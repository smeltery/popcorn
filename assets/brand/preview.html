<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popcorn brand family</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #fffaf0; color: #15151b; font: 16px system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { color: #62626f; margin: 0 0 24px; }
  .variants { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr .8fr; gap: 20px; }
  figure { margin: 0; background: white; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .art { height: 230px; width: 100%; display: flex; align-items: center; justify-content: center; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; }
  figcaption { font-weight: 600; }
  .dark { margin-top: 24px; padding: 32px; border-radius: 18px; background: #15151b; display: flex; align-items: center; gap: 24px; }
  .dark img:first-child { width: 56px; }
  .dark img:last-child { width: 210px; }
  .reference { margin-top: 36px; }
  .reference img { width: 800px; }
  @media(max-width: 700px) { body { padding: 20px; } .variants { grid-template-columns: 1fr 1fr; } .art { height: 160px; } }
</style>
<h1>Popcorn logo family</h1>
<p>Rounded cream lettering, cinema-red edging, and the same cheerful popcorn character.</p>
<div class="variants">
  <figure><div class="art"><img src="images/full-logo.png" alt="Full Popcorn logo"></div><figcaption>Full logo</figcaption></figure>
  <figure><div class="art"><img src="images/app-icon.png" alt="Popcorn app icon"></div><figcaption>App icon</figcaption></figure>
  <figure><div class="art"><img src="images/wordmark.png" alt="Popcorn wordmark"></div><figcaption>Wordmark</figcaption></figure>
  <figure><div class="art"><img src="images/monochrome.svg" alt="Popcorn monochrome mark" width="130"></div><figcaption>Monochrome</figcaption></figure>
</div>
<div class="variants" style="margin-top:24px">
  <figure><img src="images/horizontal-logo-light.png" alt="Horizontal logo on light"></figure>
  <figure style="background:#15151b"><img src="images/horizontal-logo-dark.png" alt="Horizontal logo on dark"></figure>
  <figure><img src="images/popcorn-kernel.png" width="120" alt="Popcorn kernel decoration"></figure>
  <figure><img src="images/gold-rays.svg" width="120" alt="Gold rays decoration"></figure>
</div>
<div class="dark"><a class="popcorn-button popcorn-button-primary" href="../../apps/docs/docs/index.md">Get Started →</a><a class="popcorn-button popcorn-button-secondary" href="https://github.com/smeltery/popcorn">View on GitHub</a></div>
<figure style="margin-top:24px"><img src="images/social-banner.png" alt="Wide social banner"></figure>
<figure style="margin-top:24px"><img src="images/social-preview.png" alt="Social preview card"></figure>
<div class="reference"><p>Supplied reference</p><img src="source/references/logo-and-icon.png" alt="Supplied full logo and app icon reference"></div>
</html>
