[workspace]
members = ["crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dotbrains/popcorn"
rust-version = "1.82.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.integration-test]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
strip = "none"
incremental = true
debug-assertions = false
overflow-checks = false
